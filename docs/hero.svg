<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Make Xiaohongshu AI Comics</title>
  <desc id="desc">A style-adaptive workflow from AI concept to comic series, presented by the original characters Xiao Cheng and AI Xiao Lan</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="100" cy="64" r="160" fill="#8B5CF6" opacity=".16"/>
  <circle cx="1100" cy="375" r="220" fill="#22D3EE" opacity=".13"/>
  <g opacity=".2" fill="none" stroke="#E0E7FF">
    <path d="M48 326 C180 252 236 360 352 284 S570 220 670 294" stroke-width="2" stroke-dasharray="8 12"/>
    <path d="M890 76 C960 120 1000 70 1138 138" stroke-width="2" stroke-dasharray="7 11"/>
  </g>
  <g transform="translate(72 80)">
    <rect width="640" height="8" rx="4" fill="url(#accent)"/>
    <text y="72" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MAKE XIAOHONGSHU</text>
    <text y="130" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">AI COMICS</text>
    <text y="182" fill="#C7D2FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Style-adaptive · Character-consistent · Research-first</text>
    <g transform="translate(0 224)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">
      <rect width="126" height="38" rx="19" fill="#FFFFFF" opacity=".12"/>
      <text x="63" y="25" text-anchor="middle" fill="#FDE68A">STYLE BIBLE</text>
      <rect x="140" width="156" height="38" rx="19" fill="#FFFFFF" opacity=".12"/>
      <text x="218" y="25" text-anchor="middle" fill="#FBCFE8">CHARACTERS</text>
      <rect x="310" width="140" height="38" rx="19" fill="#FFFFFF" opacity=".12"/>
      <text x="380" y="25" text-anchor="middle" fill="#A5F3FC">STORYBOARD</text>
      <rect x="464" width="92" height="38" rx="19" fill="#FFFFFF" opacity=".12"/>
      <text x="510" y="25" text-anchor="middle" fill="#DDD6FE">QA</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="746" y="42" width="418" height="336" rx="34" fill="#FFF8E7" opacity=".96"/>
    <rect x="758" y="54" width="394" height="312" rx="27" fill="none" stroke="#F6C85F" stroke-width="2" stroke-dasharray="5 8" opacity=".62"/>
    <image href="hero-characters.png" x="758" y="61" width="394" height="263" preserveAspectRatio="xMidYMid meet"/>
    <rect x="851" y="330" width="208" height="29" rx="14.5" fill="#312E81"/>
    <text x="955" y="350" text-anchor="middle" fill="#FFF7DA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.6">QINGCHEN ORIGINAL</text>
  </g>
</svg>
